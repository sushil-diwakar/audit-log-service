spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  application:
    name: audit-log-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auditdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AuditLogHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database: mysql
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 5MB

# Springdoc OpenAPI & Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

audit:
  signature:
    key-id: ${AUDIT_SIGNATURE_KEY_ID:default-key-id}
    private-key: ${AUDIT_SIGNATURE_PRIVATE_KEY:}
    public-key: ${AUDIT_SIGNATURE_PUBLIC_KEY:}
  redaction:
    hmac-secret: ${AUDIT_REDACTION_HMAC_SECRET:dev-audit-hmac-secret-9f7c2a4e8b1d6f3a}
