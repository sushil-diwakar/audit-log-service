spring:
  config:
    activate:
      on-profile: dev
  security:
    user:
      name: ${DEV_USER:root}
      password: ${DEV_PASSWORD:root}

audit:
  cors:
    allowed-origins: ${DEV_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  rate-limit:
    capacity: 100
    refill-tokens: 100
